name: manual-docker-release-tmp-2.2.0

env:
  GPG_KEY_ID_GITHUB_TECHUSER: '${{ secrets.GPG_KEY_ID_GITHUB_TECHUSER }}'
  PROJECT_NAME: ${GITHUB_REPOSITORY#*/}
  DOCKER_BAKE_PLATFORM: linux/amd64,linux/arm64

on:
  workflow_dispatch:
    inputs:
      comment:
        description: 'Comment for release'
        default: 'Temporary workflow to release docker image 2.2.0'
        required: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    # Only allow manual runs from this release branch.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout dookug-2.2.0 tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/dookug-2.2.0

      - id: getVersion
        name: getVersion into POM_XML_PROJECT_VERSION variable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          PROJECT_VERSION=$(echo -e 'setns x=http://maven.apache.org/POM/4.0.0\ncat /x:project/x:version/text()' | xmllint --shell pom.xml | grep -v /)
          echo "PROJECT_VERSION=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Force image tag to 2.2.0
        run: |
          IMAGE_TAG="2.2.0"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag => ${IMAGE_TAG}"

      - id: prepare
        name: Set RELEASED_VERSION into etc/release/.env
        run: |
          echo "RELEASED_VERSION=${{ steps.tag.outputs.IMAGE_TAG }}" >> etc/release/.env

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: docker buildx bake
        uses: docker/bake-action@v5
        with:
          workdir: etc/release
          set: |
            *.platform=${{ env.DOCKER_BAKE_PLATFORM }}
            *.args.POM_VERSION=2.2.0
          push: true
          files: |
            release.docker-compose.yml
          targets: dookug-rest-service-oracle-release,dookug-rest-service-postgres-release

      # force PRD manifest update (because this run is branch-based workflow_dispatch)
      - name: Update PRD manifest in deploy repo
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          repository: i-Cell-Mobilsoft-Open-Source/module-deploy
          event-type: update-prd-image
          client-payload: |
            {
              "image": "${{ steps.tag.outputs.IMAGE_TAG }}",
              "moduleType": "dookug-document-service"
            }